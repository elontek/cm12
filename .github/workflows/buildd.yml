name: Build Kernel 3.4 (msm8930 serrano_eur_3g)

on:
  workflow_dispatch:
    inputs:
      base_defconfig:
        description: "Temel defconfig"
        default: "msm8930_serrano_defconfig"
      variant_defconfig:
        description: "Varyant fragment (boş bırakırsan sadece base)"
        default: "msm8930_serrano_eur_3g_defconfig"

env:
  KERNEL_REPO: https://github.com/SherifMoShalaby/android_kernel_samsung_msm8930-common
  KERNEL_BRANCH: lineage-21
  TOOLCHAIN_REPO: https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9
  TOOLCHAIN_BRANCH: lineage-19.1

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Araçları kontrol et (kurulum yok)
        run: |
          for t in gcc-9 make bc bison flex git; do
            command -v $t >/dev/null || { echo "::error::$t yok"; exit 1; }
          done
          gcc-9 --version | head -1

      - name: Kernel kaynağını çek
        run: git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel

      - name: Toolchain çek (GCC 4.9)
        run: git clone --depth=1 -b "$TOOLCHAIN_BRANCH" "$TOOLCHAIN_REPO" toolchain

      - name: .config oluştur (base + varyant)
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          MK="make O=out ARCH=arm HOSTCC=gcc-9 CROSS_COMPILE=arm-linux-androideabi- CC=arm-linux-androideabi-gcc"

          $MK "${{ inputs.base_defconfig }}"

          if [ -n "${{ inputs.variant_defconfig }}" ]; then
            cat "arch/arm/configs/${{ inputs.variant_defconfig }}" >> out/.config
          fi

          # 3.4'te derlenmeyen / gereksiz seçenekleri kapat
          if [ -f fs/sdfat/Kconfig ]; then
            for s in $(grep -h -E '^config ' fs/sdfat/Kconfig | awk '{print $2}'); do
              echo "# CONFIG_$s is not set" >> out/.config
            done
          fi
          echo "# CONFIG_TEST_IOSCHED is not set" >> out/.config

          # Link hatalarının düzeltmesi
          echo "CONFIG_RADIO_IRIS_TRANSPORT=y" >> out/.config
          echo "CONFIG_NETFILTER_NETLINK_QUEUE_CT=y" >> out/.config

          yes "" | $MK oldconfig > /dev/null || true
          grep -E "CONFIG_MACH_SERRANO_EUR_3G|SDFAT|TEST_IOSCHED|IRIS_TRANSPORT|QUEUE_CT" out/.config || true

      - name: Derle
        working-directory: kernel
        run: |
          set -o pipefail
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          export KBUILD_BUILD_USER=github
          export KBUILD_BUILD_HOST=actions
          MK="make O=out ARCH=arm HOSTCC=gcc-9 CROSS_COMPILE=arm-linux-androideabi- CC=arm-linux-androideabi-gcc"

          if ! $MK -j"$(nproc)" zImage modules 2>&1 | tee build.log; then
            echo "::group::Hata satırları"
            grep -n -E "error:|\*\*\*|undefined reference|multiple definition" build.log | head -40
            echo "::endgroup::"
            exit 1
          fi
          ls -lh out/arch/arm/boot/

      - name: Çıktıları topla
        if: always()
        working-directory: kernel
        run: |
          mkdir -p ../artifacts/modules
          cp out/arch/arm/boot/zImage ../artifacts/ 2>/dev/null || true
          find out -name "*.ko" -exec cp {} ../artifacts/modules/ \; 2>/dev/null || true
          cp out/.config ../artifacts/config 2>/dev/null || true
          cp build.log ../artifacts/ 2>/dev/null || true

      - name: Artifact yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-serrano_eur_3g
          path: artifacts/
