name: Build crDroid A13 (klte / G900F)

on:
  workflow_dispatch:

env:
  MANIFEST_URL: https://github.com/crdroidandroid/android.git
  MANIFEST_BRANCH: '13.0'
  DEVICE: klte
  BUILD_TYPE: userdebug
  CCACHE_SIZE: 9G

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Disk alanı aç
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 8192
          build-mount-path: /builder
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Yetkileri düzelt
        run: sudo chown -R runner:runner /builder

      - name: Bağımlılıklar
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libncurses5 x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python-is-python3 git-lfs gperf imagemagick lib32readline-dev lib32ncurses5-dev liblz4-tool pngcrush schedtool squashfs-tools ccache bc lzop libssl-dev rsync openjdk-11-jdk
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          git config --global user.name "builder"
          git config --global user.email "builder@example.com"

      - name: ccache geri yükle
        uses: actions/cache/restore@v4
        with:
          path: /builder/.ccache
          key: ccache-${{ env.DEVICE }}-${{ github.run_id }}
          restore-keys: ccache-${{ env.DEVICE }}-

      - name: Kaynak kodu çek
        working-directory: /builder
        run: |
          mkdir -p crd && cd crd
          ~/bin/repo init -u $MANIFEST_URL -b $MANIFEST_BRANCH --depth=1 --git-lfs
          git ls-remote --heads $MANIFEST_URL | sed 's#.*refs/heads/##' | head -20
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/klte.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="khalvat" fetch="https://github.com/Khalvat-M" />
            <remote name="los" fetch="https://github.com/LineageOS" />

            <project name="device_samsung_klte" path="device/samsung/klte" remote="khalvat" revision="12.1" />
            <project name="device_samsung_msm8974-common" path="device/samsung/msm8974-common" remote="khalvat" revision="12.1" />
            <project name="kernel_samsung_msm8974" path="kernel/samsung/msm8974" remote="khalvat" revision="lineage-19.1" />
            <project name="vendor_samsung" path="vendor/samsung" remote="khalvat" revision="12.1" />

            <!-- hardware/samsung ve devicesettings crDroid manifestinde zaten var; hata verirse buraya ekle -->
            <project name="android_device_samsung_qcom-common" path="device/samsung/qcom-common" remote="los" revision="lineage-20.0" />
          </manifest>
          EOF
          ~/bin/repo sync -c -j4 --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune

      - name: Derle
        working-directory: /builder/crd
        env:
          USE_CCACHE: 1
          CCACHE_EXEC: /usr/bin/ccache
          CCACHE_DIR: /builder/.ccache
        run: |
          ccache -M $CCACHE_SIZE
          source build/envsetup.sh
          lunch lineage_${DEVICE}-${BUILD_TYPE}
          # 6 saatlik limite çarpmadan ccache kaydedilsin diye timeout
          timeout 320m mka bacon -j$(nproc) || echo "Zaman doldu veya hata; ccache kaydedilecek"

      - name: ccache kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /builder/.ccache
          key: ccache-${{ env.DEVICE }}-${{ github.run_id }}

      - name: Çıktıyı yayınla
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: crdroid-${{ env.DEVICE }}-${{ github.run_number }}
          files: |
            /builder/crd/out/target/product/${{ env.DEVICE }}/crDroidAndroid-*.zip
            /builder/crd/out/target/product/${{ env.DEVICE }}/recovery.img
            /builder/crd/out/target/product/${{ env.DEVICE }}/boot.img
