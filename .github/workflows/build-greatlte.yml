name: Build Kernel (Galaxy Note 8 greatlte)

on:
  workflow_dispatch:

env:
  KERNEL_REPO: https://github.com/8890q/android_kernel_samsung_universal8895
  KERNEL_BRANCH: lineage-21-rel
  DEFCONFIG: exynos8895-greatlte_defconfig
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_ARM32: arm-linux-gnueabi-

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Bağımlılıkları kur
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison flex libssl-dev libncurses-dev \
            build-essential device-tree-compiler lzop cpio perl python3 \
            clang-14 lld-14 llvm-14 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Kernel kaynağını indir
        run: git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel

      - name: Derle
        working-directory: kernel
        run: |
          set -o pipefail
          export HOSTCFLAGS="-fcommon -Wno-error"
          MAKE_ARGS="O=out ARCH=arm64 CC=clang-14 CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=$CROSS_COMPILE CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            KCFLAGS=-Wno-error"
          make $MAKE_ARGS $DEFCONFIG
          make $MAKE_ARGS -j"$(nproc)" 2>&1 | tee build.log

      - name: Çıktıları topla
        if: always()
        run: |
          mkdir -p dist
          cp kernel/out/arch/arm64/boot/Image* dist/ 2>/dev/null || true
          find kernel/out/arch/arm64/boot/dts -name '*.dtb' -exec cp {} dist/ \; 2>/dev/null || true
          cp kernel/out/.config dist/config 2>/dev/null || true
          cp kernel/build.log dist/ 2>/dev/null || true

      - name: Artifact yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greatlte-kernel
          path: dist/
