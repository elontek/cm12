name: Build EvolutionX A12 (klte / G900F)

on:
  workflow_dispatch:

env:
  MANIFEST_URL: https://github.com/Evolution-X/manifest
  MANIFEST_BRANCH: snow          # A12.1 dalı; farklıysa değiştir
  DEVICE: klte
  BUILD_TYPE: userdebug
  CCACHE_SIZE: 9G

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Disk alanı aç
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 8192
          build-mount-path: /builder
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Yetkileri düzelt
        run: sudo chown -R runner:runner /builder

      - name: Bağımlılıklar
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libncurses5 x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python-is-python3 ccache bc lzop libssl-dev rsync openjdk-11-jdk
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          git config --global user.name "builder"
          git config --global user.email "builder@example.com"

      - name: ccache geri yükle
        uses: actions/cache/restore@v4
        with:
          path: /builder/.ccache
          key: ccache-${{ env.DEVICE }}-${{ github.run_id }}
          restore-keys: ccache-${{ env.DEVICE }}-

      - name: Kaynak kodu çek
        working-directory: /builder
        run: |
          mkdir -p evo && cd evo
          ~/bin/repo init -u $MANIFEST_URL -b $MANIFEST_BRANCH --depth=1 --git-lfs
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/klte.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="khalvat" fetch="https://github.com/Khalvat-M" />
            <remote name="los" fetch="https://github.com/LineageOS" />

            <project name="device_samsung_klte" path="device/samsung/klte" remote="khalvat" revision="12.1" />
            <project name="device_samsung_msm8974-common" path="device/samsung/msm8974-common" remote="khalvat" revision="12.1" />
            <project name="kernel_samsung_msm8974" path="kernel/samsung/msm8974" remote="khalvat" revision="lineage-19.1" />
            <project name="vendor_samsung" path="vendor/samsung" remote="khalvat" revision="12.1" />

            <!-- Lineage bağımlılıkları (lineage.dependencies'ten) -->
            <project name="android_device_samsung_qcom-common" path="device/samsung/qcom-common" remote="los" revision="lineage-19.1" />
            <project name="android_hardware_samsung" path="hardware/samsung" remote="los" revision="lineage-19.1" />
            <project name="android_packages_resources_devicesettings" path="packages/resources/devicesettings" remote="los" revision="lineage-19.1" />
          </manifest>
          EOF
          ~/bin/repo sync -c -j4 --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune

      - name: Cihaz ağacını Evolution X'e uyarla
        working-directory: /builder/evo/device/samsung/klte
        run: |
          if [ -f lineage_klte.mk ] && [ ! -f evolution_klte.mk ]; then
            git mv lineage_klte.mk evolution_klte.mk
          fi
          sed -i 's#vendor/lineage/config/common_full_phone.mk#vendor/evolution/config/common_full_phone.mk#' evolution_klte.mk
          sed -i 's#lineage_klte#evolution_klte#g' AndroidProducts.mk evolution_klte.mk
          sed -i 's#lineage_klte#evolution_klte#g' *.mk || true
          grep -n "PRODUCT_NAME\|inherit-product" evolution_klte.mk

      - name: Derle
        working-directory: /builder/evo
        env:
          USE_CCACHE: 1
          CCACHE_EXEC: /usr/bin/ccache
          CCACHE_DIR: /builder/.ccache
        run: |
          ccache -M $CCACHE_SIZE
          source build/envsetup.sh
          lunch evolution_${DEVICE}-${BUILD_TYPE}
          # 6 saatlik limite çarpmadan ccache kaydedilsin diye timeout
          timeout 320m mka evolution -j$(nproc) || echo "Zaman doldu veya hata; ccache kaydedilecek"

      - name: ccache kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /builder/.ccache
          key: ccache-${{ env.DEVICE }}-${{ github.run_id }}

      - name: Çıktıyı yayınla
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: evolutionx-${{ env.DEVICE }}-${{ github.run_number }}
          files: |
            /builder/evo/out/target/product/${{ env.DEVICE }}/evolution_*.zip
            /builder/evo/out/target/product/${{ env.DEVICE }}/recovery.img
            /builder/evo/out/target/product/${{ env.DEVICE }}/boot.img
