name: Build Kernel (j5y17lte)

on:
  workflow_dispatch:

env:
  KERNEL_REPO: https://github.com/Andeveloperlab/Revival-kernel
  KERNEL_BRANCH: r30p0-stable
  DEFCONFIG: exynos7870-j5y17lte_defconfig
  ARCH: arm64
  SUBARCH: arm64

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Gerekli paketleri kur
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev build-essential \
            git ccache cpio zip device-tree-compiler python3 \
            lz4 xz-utils

      - name: Kernel kaynağını çek
        run: |
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel

      - name: Toolchain indir (GCC 4.9 aarch64)
        run: |
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
            toolchain
          ls toolchain/bin | head
          test -x toolchain/bin/aarch64-linux-android-gcc

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Derle
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-android-
          export CCACHE_DIR=~/.ccache
          export ANDROID_MAJOR_VERSION=p

          which aarch64-linux-android-gcc
          aarch64-linux-android-gcc --version

          mkdir -p out
          make O=out ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE $DEFCONFIG
          make O=out ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE \
            CC="ccache ${CROSS_COMPILE}gcc" \
            -j$(nproc) 2>&1 | tee build.log

      - name: Çıktıları topla
        if: always()
        run: |
          mkdir -p artifacts
          cp kernel/build.log artifacts/ || true
          cp kernel/out/arch/arm64/boot/Image* artifacts/ || true
          cp kernel/out/arch/arm64/boot/dts/exynos/*.dtb artifacts/ 2>/dev/null || true
          cp kernel/out/arch/arm64/boot/dts/*.dtb artifacts/ 2>/dev/null || true
          cp kernel/out/.config artifacts/config || true

      - name: Artifact yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j5y17lte-kernel
          path: artifacts/
