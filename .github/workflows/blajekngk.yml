
name: Build Exynos 7420 - zeroltexx

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make bc bison flex \
            build-essential libssl-dev \
            libelf-dev libncurses-dev \
            python3 cpio perl \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            --branch nx-9.0 \
            https://github.com/enesuzun2002/android_kernel_samsung_exynos7420.git \
            kernel

      - name: Find zeroltexx defconfig
        id: config
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          echo "zeroltexx defconfig araniyor..."

          find arch/arm64/configs -type f \
            -iname '*zeroltexx*defconfig' -print

          CONFIG="$(find arch/arm64/configs -type f \
            -iname '*zeroltexx*defconfig' | head -n 1 || true)"

          if [ -z "$CONFIG" ]; then
            echo "zeroltexx isimli defconfig bulunamadi."
            echo "Mevcut Samsung defconfig dosyalari:"
            find arch/arm64/configs -type f \
              -name '*defconfig' | grep -Ei 'zero|samsung|exynos' || true
            exit 1
          fi

          echo "Defconfig: $CONFIG"
          echo "config=${CONFIG#arch/arm64/configs/}" \
            >> "$GITHUB_OUTPUT"

      - name: Configure kernel
        working-directory: kernel
        run: |
          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            "${{ steps.config.outputs.config }}"

      - name: Build kernel
        working-directory: kernel
        shell: bash
        run: |
          set -o pipefail

          make -j"$(nproc)" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            2>&1 | tee ../build.log

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts

          if [ -d kernel/arch/arm64/boot ]; then
            find kernel/arch/arm64/boot -type f \
              \( -name 'Image' \
              -o -name 'Image.gz' \
              -o -name 'Image.gz-dtb' \
              -o -name '*.dtb' \
              -o -name '*.dtbo' \) \
              -exec cp --parents {} artifacts/ \;
          fi

          cp build.log artifacts/ 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeroltexx-kernel
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
          
