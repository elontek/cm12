name: Build OrangeFox - T113

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git-core \
            gnupg \
            flex \
            bison \
            build-essential \
            zip \
            curl \
            zlib1g-dev \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386 \
            lib32ncurses5-dev \
            x11proto-core-dev \
            libx11-dev \
            lib32z1-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            unzip \
            python3 \
            python3-pip \
            rsync \
            bc \
            cpio \
            libssl-dev

      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Clone OrangeFox
        run: |
          git clone --depth=1 \
            https://gitlab.com/OrangeFox/sync.git \
            orangefox_sync

      - name: Sync OrangeFox 12.1
        run: |
          cd orangefox_sync
          ./orangefox_sync.sh --branch 12.1 --path "$GITHUB_WORKSPACE/fox"

      - name: Clone T113 device tree
        run: |
          cd fox
          git clone \
            -b android-7.1 \
            https://github.com/TeamWin/android_device_samsung_goyave \
            device/samsung/goyave

      - name: Clone SC8830 common tree
        run: |
          cd fox
          git clone \
            https://github.com/TeamWin/android_device_samsung_sc8830-common \
            device/samsung/sc8830-common

      - name: Prepare OrangeFox device tree
        run: |
          cd fox/device/samsung/goyave

          sed -i 's/omni_goyave/twrp_goyave/g' omni_goyave.mk

          cp omni_goyave.mk twrp_goyave.mk

          cat >> BoardConfig.mk <<'EOF'

          # OrangeFox
          export OF_TARGET_DEVICE=goyave
          export FOX_BUILD_DEVICE=goyave
          export FOX_12_1=1
          export TARGET_ARCH=arm
          export OF_USE_MAGISKBOOT=1
          EOF

      - name: Build OrangeFox
        run: |
          cd fox

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export FOX_BUILD_DEVICE=goyave
          export TARGET_ARCH=arm

          source build/envsetup.sh

          lunch twrp_goyave-eng

          mka recoveryimage

      - name: Find output
        run: |
          find fox/out/target/product/goyave \
            -type f \
            \( -name "*.img" -o -name "*.zip" \) \
            -print

      - name: Upload recovery
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-T113
          path: |
            fox/out/target/product/goyave/*.img
            fox/out/target/product/goyave/*.zip
          if-no-files-found: warn
