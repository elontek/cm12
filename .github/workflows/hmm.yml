name: Build TWRP a5ultexx

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Disk alanı aç
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Bağımlılıklar
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-8-jdk python2 git-core gnupg flex bison build-essential \
            zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip \
            fontconfig bc ccache repo
          sudo update-alternatives --set java /usr/lib/jvm/java-8-openjdk-amd64/jre/bin/java || true
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Kaynak çek (TWRP omni 8.1)
        run: |
          mkdir -p ~/twrp && cd ~/twrp
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-8.1
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags

      - name: Device tree çek
        run: |
          cd ~/twrp
          git clone --depth=1 -b android-8.1 \
            https://github.com/Galaxy-A5-Development/device_samsung_a5ultexx-twrp.git \
            device/samsung/a5ultexx

      - name: Derle
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          lunch omni_a5ultexx-eng
          mka recoveryimage -j$(nproc)

      - name: Artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: twrp-a5ultexx
          path: |
            ~/twrp/out/target/product/a5ultexx/recovery.img
            ~/twrp/out/target/product/a5ultexx/*.tar
