
name: Build Exynos 7420 Kernel

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Kernel defconfig (bos birakilirsa otomatik aranir)"
        required: false
        type: string
        default: ""
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make bc bison flex \
            build-essential libssl-dev \
            libelf-dev libncurses-dev \
            python3 perl cpio \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            --branch nx-9.0 \
            https://github.com/enesuzun2002/android_kernel_samsung_exynos7420.git \
            kernel

      - name: Detect configuration
        id: config
        working-directory: kernel
        env:
          REQUESTED_DEFCONFIG: ${{ inputs.defconfig }}
        run: |
          set -eu

          echo "Available matching defconfigs:"
          find arch/arm64/configs -type f -name '*defconfig' \
            | grep -Ei '7420|zerofl|zerolte|noblelte|hero' \
            || true

          if [ -n "$REQUESTED_DEFCONFIG" ]; then
            CONFIG="$REQUESTED_DEFCONFIG"
          else
            CONFIG="$(find arch/arm64/configs -type f \
              -name '*defconfig' \
              | grep -Ei '7420.*defconfig|defconfig.*7420' \
              | head -n 1 || true)"
          fi

          if [ -z "$CONFIG" ]; then
            echo "::error::Defconfig bulunamadi. Yukaridaki listeyi inceleyip workflow_dispatch alanina tam dosya adini gir."
            exit 1
          fi

          CONFIG="${CONFIG##*/}"

          if [ ! -f "arch/arm64/configs/$CONFIG" ]; then
            echo "::error::Defconfig mevcut degil: $CONFIG"
            exit 1
          fi

          echo "defconfig=$CONFIG" >> "$GITHUB_OUTPUT"
          echo "Selected config: $CONFIG"

      - name: Configure kernel
        working-directory: kernel
        run: |
          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            "${{ steps.config.outputs.defconfig }}"

      - name: Build kernel
        working-directory: kernel
        run: |
          make -j"$(nproc)" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            2>&1 | tee ../build.log

      - name: Collect build outputs
        if: always()
        run: |
          mkdir -p artifacts

          find kernel/arch/arm64/boot -maxdepth 2 -type f \
            \( -name 'Image' \
            -o -name 'Image.gz' \
            -o -name 'Image.gz-dtb' \
            -o -name '*.dtb' \
            -o -name '*.dtbo' \) \
            -exec cp --parents {} artifacts/ \; || true

          cp build.log artifacts/ 2>/dev/null || true

      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exynos7420-kernel
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
          
